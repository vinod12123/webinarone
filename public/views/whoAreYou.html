<!doctype html>
<html lang="en" class="no-js">
    <head>
        <title id="title">Who are you?</title>
        <link id="icon" rel="shortcut icon" href="../images/logo.svg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.svg" />

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta id="description" name="description" content="Secure meeting portal." />
        <meta id="keywords" name="keywords" content="login, secure, conference, meeting" />

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

        <link rel="stylesheet" type="text/css" href="../css/Translate.css" />

        <script async src="../js/Stats.js"></script>
        <script defer src="../js/Brand.js"></script>
        <script async src="../js/Translate.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <style>
            :root {
                --bg:           #0f0f10;
                --card:         #1a1a1c;
                --ink:          #f1f1f1;
                --ink-soft:     #b5b5b5;
                --ink-muted:    #7a7a7a;
                --border:       #2a2a2d;
                --border-focus: #ffffff;
                --radius:       12px;
                --ease:         cubic-bezier(0.4, 0, 0.2, 1);
                --ff-serif:     'Instrument Serif', Georgia, serif;
                --ff-sans:      'Outfit', sans-serif;
            }

            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            html, body {
                height: 100%;
                background: var(--bg);
                font-family: var(--ff-sans);
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
            }

            body::before {
                content: '';
                position: fixed;
                inset: 0;
                background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
                background-size: 28px 28px;
                pointer-events: none;
                z-index: 0;
            }

            .page {
                position: relative;
                z-index: 1;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 20px;
                width: 100%;
                max-width: 420px;
                padding: 52px 48px 48px;
                box-shadow:
                    0 1px 0 rgba(255,255,255,0.04) inset,
                    0 8px 32px rgba(0,0,0,0.4),
                    0 32px 64px rgba(0,0,0,0.3);
                animation: cardIn 0.5s var(--ease) both;
            }

            @keyframes cardIn {
                from { opacity: 0; transform: translateY(20px) scale(0.98); }
                to   { opacity: 1; transform: translateY(0) scale(1); }
            }

            .logo-wrap {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-bottom: 44px;
                animation: fadeUp 0.5s 0.1s var(--ease) both;
            }

            .logo-dot {
                width: 10px;
                height: 10px;
                background: var(--ink);
                border-radius: 50%;
            }

            .logo-name {
                font-family: var(--ff-serif);
                font-size: 17px;
                letter-spacing: 0.2px;
                color: var(--ink);
            }

            .card-title {
                font-family: var(--ff-serif);
                font-size: 30px;
                font-weight: 400;
                line-height: 1.2;
                color: var(--ink);
                margin-bottom: 10px;
                text-align: center;
                animation: fadeUp 0.5s 0.15s var(--ease) both;
            }

            .card-sub {
                font-size: 14px;
                color: var(--ink-soft);
                font-weight: 300;
                line-height: 1.65;
                margin-bottom: 36px;
                text-align: center;
                animation: fadeUp 0.5s 0.22s var(--ease) both;
            }

            .btn-group {
                display: flex;
                flex-direction: column;
                gap: 12px;
                animation: fadeUp 0.5s 0.32s var(--ease) both;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                border-radius: var(--radius);
                font-family: var(--ff-sans);
                font-size: 15px;
                font-weight: 500;
                letter-spacing: 0.2px;
                padding: 14px;
                cursor: pointer;
                text-align: center;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                transition: background 0.2s var(--ease), transform 0.15s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
            }

            .btn-primary {
                background: var(--ink);
                color: #0f0f10;
                border: 1px solid var(--ink);
                font-weight: 600;
            }

            .btn-primary:hover {
                background: #d8d8d8;
                border-color: #d8d8d8;
                transform: translateY(-1px);
                box-shadow: 0 4px 20px rgba(255,255,255,0.12);
                color: #0f0f10;
                text-decoration: none;
            }

            .btn-secondary {
                background: transparent;
                color: var(--ink);
                border: 1px solid var(--border);
            }

            .btn-secondary:hover {
                background: rgba(255,255,255,0.05);
                border-color: #444;
                transform: translateY(-1px);
                color: var(--ink);
                text-decoration: none;
            }

            .btn-primary:active,
            .btn-secondary:active { transform: translateY(0); }

            .btn-icon {
                width: 18px;
                height: 18px;
                opacity: 0.85;
            }

            .divider {
                display: flex;
                align-items: center;
                gap: 12px;
                color: var(--ink-muted);
                font-size: 12px;
                margin: 4px 0;
            }

            .divider::before,
            .divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: var(--border);
            }

            #google_translate_element {
                position: fixed;
                top: 12px;
                right: 16px;
                z-index: 999;
                opacity: 0.4;
            }

            @keyframes fadeUp {
                from { opacity: 0; transform: translateY(10px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            @media (max-width: 480px) {
                .card { padding: 36px 24px 32px; }
            }
        </style>
    </head>
    <body>
        <!-- <div id="google_translate_element"></div> -->

        <div class="page">
            <div class="card">

                <div class="logo-wrap header-brand">
                    <div class="logo-dot"></div>
                    <span class="logo-name">Meet</span>
                </div>

                <h1 id="whoAreYouTitle" class="card-title">Who are you?</h1>
                <p id="whoAreYouDescription" class="card-sub">
                    If you're the presenter, please log in.<br />
                    Otherwise, wait for the presenter to join.
                </p>

                <div class="btn-group">
                    <a id="presenterLoginButton" class="btn-primary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Login as Presenter
                    </a>

                    <div class="divider">or</div>

                    <a id="guestJoinRoomButton" class="btn-secondary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Join as Guest
                    </a>
                </div>

            </div>
        </div>

        <script async src="../js/WhoAreYou.js"></script>
        <script defer src="../js/Landing.js"></script>
        <script async defer src="https://buttons.github.io/buttons.js"></script>
    </body>
</html>
